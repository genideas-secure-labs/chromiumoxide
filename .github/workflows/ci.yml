on:
  push:
    branches:
      - main
  pull_request:

name: Continuous integration

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  fmt:
    name: Rustfmt
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all -- -D warnings
      # The pipe transport is behind a default-off feature; without this it is never linted.
      - run: cargo clippy --all --features pipe-transport --lib --tests -- -D warnings

  msrv:
    name: MSRV
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --lib
      - run: cargo check --lib --features pipe-transport

  test:
    name: Test Core
    needs: [fmt, clippy, msrv]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib
      # The pipe transport's own tests: they need no browser, and without the feature they do
      # not even compile, so a CI run without it skips them silently.
      - run: cargo test --lib --features pipe-transport

  test-integration:
    name: Test Integration
    needs: [fmt, clippy, msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: RUST_TEST_THREADS=1 cargo test --test '*'
      # `pipe_handler` declares `required-features = ["pipe-transport"]`: the line above skips it.
      - run: cargo test --features pipe-transport --test pipe_handler

  test-fetcher:
    name: Test Fetcher
    needs: [fmt, clippy, msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: RUST_TEST_THREADS=1 cargo test -p chromiumoxide_fetcher

  check-examples:
    name: Check Examples
    needs: [fmt, clippy, msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check examples
        run: cargo check --examples --features fetcher,zip8,rustls
